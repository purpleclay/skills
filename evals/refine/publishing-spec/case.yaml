schema_version: "1.0"
name: publishing-spec
description: Picking a ready spec that /to-tickets has started publishing says to finish publishing it with /to-tickets, and leaves the spec unchanged.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
  # /refine has already shown the table of saved specs. It holds no skill text, so the reply below
  # loads the current /refine. Number 2 has a breakdown whose first ticket is published.
  history_file: history.jsonl
execution:
  prompt: |
    /refine I'd like to refine number 2 from the table you just showed me further. I want to add reminders to it.
  max_turns: 15
  allowed_tools: [Agent, Bash, Read, Write, Edit]
graders:
  - type: regex
    name: points-to-to-tickets
    pattern: '/to-tickets'
  # file_exists sees only files a run creates, so a change to the scaffolded spec shows in the trace:
  # a Write or Edit of it, or a Bash command that names it and writes into it with sed, tee, a redirect
  # or a script.
  - type: regex
    name: leaves-the-spec-unchanged
    target: trace
    pattern: '"name":"(?:(?:Write|Edit)","input":\{(?=(?:"(?:[^"\\]|\\.)*":(?:"(?:[^"\\]|\\.)*"|true|false|-?\d+|null),)*"file_path":"[^"]*/\.git/refine/show-a-due-date-on-each-todo\.md")|Bash","input":\{(?=(?:"(?:[^"\\]|\\.)*":(?:"(?:[^"\\]|\\.)*"|true|false|-?\d+|null),)*"command":"(?:(?=(?:[^"\\]|\\.)*?(?:sed -i|\btee\b|\.write\(|write_text\())(?=(?:[^"\\]|\\.)*?show-a-due-date-on-each-todo\.md)|(?:[^"\\]|\\.)*?>>?\s*(?:\\")?[^\s"\\]*show-a-due-date-on-each-todo\.md)))'
    match: not_contains
  - type: regex
    name: asks-no-interview-question
    target: trace
    pattern: '\*\*\d+ · [^*]+\*\*\\n\\n'
    match: not_contains
