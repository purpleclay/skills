schema_version: "1.0"
name: question-format
description: The first round asks at most three questions, each opening with a number and a short label of more than one word and ending with an italic "Decides:" line on what the answer decides.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /refine Let people mark a todo as done.
  max_turns: 30
  allowed_tools: [Agent]
graders:
  # Lookups run in the background, and each one that reports after the round is asked gets a
  # one-line reply, so the round itself is read from the trace rather than the last message.
  - type: regex
    name: labels-its-questions
    target: trace
    pattern: '\*\*1 · [^*\n]+\*\*'
  - type: regex
    name: asks-at-most-three
    target: trace
    pattern: '\*\*4 · '
    match: not_contains
  # Labels should be two or three words. Four slips through often enough to allow it here.
  - type: regex
    name: labels-are-short-but-not-one-word
    target: trace
    pattern: '\*\*\d+ · (?:[^\s*]+|[^\s*]+(?: [^\s*]+){4,})\*\*'
    match: not_contains
  # The round is one JSON string in the trace, so each question runs to the next question or
  # the end of the string, and must end there with an italic "*Decides: ...*" line.
  - type: regex
    name: each-question-ends-with-what-it-decides
    target: trace
    pattern: '\*\*\d+ · [^*]+\*\*(?:(?!\*\*\d+ · )(?:[^"\\]|\\.))*?(?<!\\n\*Decides: (?:[^*\\]|\\.)*[^*]\*(?:\\n)*)(?=(?:\\n)*(?:\*\*\d+ · |"))'
    match: not_contains
