schema_version: "1.0"
name: scout-lookups
description: Code lookups go through the scout, and the main conversation loads no repository files itself.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /refine Let people mark a todo as done. Look up whatever you need about how the code works today, then show me the spec as it stands. I will not answer any questions in this session.
  max_turns: 30
  allowed_tools: [Agent]
graders:
  - type: tool_used
    name: asks-the-scout
    tool: Agent
    input_match: "purpleclay-skills:scout"
  # Subagent calls carry a parent_tool_use_id, so a null one means the main conversation made the call.
  # The skill may run two git commands itself: the tracking check, and finding where to save the spec.
  - type: regex
    name: main-conversation-reads-no-files
    target: trace
    pattern: '^\{"type":"assistant".*"type":"tool_use","id":"[^"]*","name":"(?:(?:Read|Grep|Glob|NotebookRead)"|Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?!git (?:ls-files --error-unmatch|rev-parse) )).*"parent_tool_use_id":null'
    flags: m
    match: not_contains
