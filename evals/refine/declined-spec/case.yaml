schema_version: "1.0"
name: declined-spec
description: Picking a ready spec and declining to refine it further ends by naming the spec by its title and pointing to /to-tickets, with no file path and no other command.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
  # /refine has already shown the table of saved specs. It holds no skill text, so the reply below
  # loads the current /refine. Number 2 is ready and has no breakdown.
  history_file: history.jsonl
execution:
  prompt: |
    /refine I'll pick number 2 from the table you just showed me. I don't want to change anything in it.
  max_turns: 15
  allowed_tools: [Agent, Bash, Read, Write, Edit]
graders:
  # The last non-empty line names both, in either order.
  - type: regex
    name: ends-on-one-line-with-title-and-command
    pattern: '(?:^|\n)(?=[^\n]*Show a `?due`? date on each todo)(?=[^\n]*/to-tickets)[^\n]*\s*$'
    flags: i
  - type: regex
    name: shows-no-file-path
    pattern: '\.git\b|\.md\b'
    match: not_contains
  # A slash that starts a word, other than /to-tickets, is another command or an absolute path.
  - type: regex
    name: names-no-other-command
    pattern: '(?<![\w./])/(?!to-tickets\b)[a-z][\w-]*'
    match: not_contains
  - type: regex
    name: asks-no-interview-question
    target: trace
    pattern: '\*\*\d+ · [^*]+\*\*\\n\\n'
    match: not_contains
