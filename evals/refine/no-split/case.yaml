schema_version: "1.0"
name: no-split
description: However large the work, /refine keeps all of it in one spec and never proposes splitting it into several tickets.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /refine Let people sync their todos between computers. That means a server that stores each account's todos, accounts with a login, a `todo sync` command, and moving everyone's existing local todos onto the server, which deletes the local file afterwards and cannot be undone. It is a lot of work, and it has to land in stages to keep main green. Show me the spec as it stands. I will not answer any questions in this session.
  max_turns: 30
  allowed_tools: [Agent]
graders:
  - type: regex
    name: produces-a-spec
    pattern: "## Acceptance criteria"
  - type: llm
    name: one-spec-for-all-of-it
    criteria: |
      The response shows one spec for all of the work, and neither proposes nor asks about splitting the work into several tickets or specs. It leaves no part of the work for a later ticket or spec. Recording as a constraint that the work lands in stages is fine, and so are open questions about parts of the work.
