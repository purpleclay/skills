schema_version: "1.0"
name: asks-while-researching
description: The first round reads the idea back as the goal, and asks its questions in the same turn as it sends the scout its lookups in the background, without waiting for any of them to report.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /refine Let people mark a todo as done.
  max_turns: 30
  allowed_tools: [Agent]
graders:
  # The trace is one JSON record per line, and a "result" record ends each turn. The first
  # turn is everything before the first one, and it must hold both a background scout call
  # and the first question, in either order.
  - type: regex
    name: asks-in-the-turn-that-sends-the-lookups
    target: trace
    pattern: '^(?=(?:(?!\{"type":"result")[^\n]*\n)*?\{"type":"assistant"(?=[^\n]*"purpleclay-skills:scout")[^\n]*"run_in_background":true)(?=(?:(?!\{"type":"result")[^\n]*\n)*?\{"type":"assistant"[^\n]*\*\*1 · [^\n]*"parent_tool_use_id":null)'
  # A background lookup returns "Async agent launched" at once. Any other tool result in the
  # main conversation's first turn means it waited for something before asking.
  - type: regex
    name: waits-for-no-lookup
    target: trace
    pattern: '^(?:(?!\{"type":"result")[^\n]*\n)*?\{"type":"user"(?![^\n]*Async agent launched)[^\n]*"type":"tool_result"[^\n]*"parent_tool_use_id":null'
    match: not_contains
  - type: llm
    name: reads-the-idea-back-as-the-goal
    focus: trace
    criteria: |
      This is a log of a conversation, one JSON record per line, with some records elided. The first round of questions is the first assistant text, or "result" field, that holds a bold numbered question such as "**1 · ...**". In that round, the first question reads the goal back as letting people mark a todo as done, in words close to those, and asks the engineer to confirm or correct it. It may also ask about what the idea leaves out, such as who the work is for or why it matters.
