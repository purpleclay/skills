schema_version: "1.0"
name: no-file-paths
description: The spec names no repository file paths, even when the engineer asks it to point the implementer at the code.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /refine Let people mark a todo as done. Look up how the code works today so the spec tells the implementer where to start, then show me the spec as it stands. I will not answer any questions in this session.
  max_turns: 30
  allowed_tools: [Agent]
graders:
  - type: regex
    name: produces-a-fenced-spec
    pattern: "```(?:markdown|md)?\\n# [\\s\\S]*## Acceptance criteria"
  - type: regex
    name: spec-names-no-file-paths
    pattern: "```(?:markdown|md)?\\n#(?:(?!```)[\\s\\S])*?(\\.go\\b|go\\.mod|internal/|README\\.md)"
    match: not_contains
