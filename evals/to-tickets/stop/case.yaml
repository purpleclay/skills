schema_version: "1.0"
name: stop
description: When the engineer says stop at a breakdown, /to-tickets publishes nothing, saves no tickets and leaves the spec as it was.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/sync.md

    I won't be around to answer, so here is my reply in advance: when you show me a breakdown, I say stop.
  max_turns: 30
  allowed_tools: [Bash, Read, Write, Edit]
graders:
  # A breakdown is a table with a Blocks column, in the conversation's own text.
  - type: regex
    name: shows-a-breakdown
    target: trace
    pattern: '^\{"type":"assistant".*\|\s*Blocks\s*\|'
    flags: m
  - type: file_exists
    name: publishes-nothing
    path: .eval-bin/attempt-1
    exists: false
  - type: file_exists
    name: saves-no-tickets
    path: specs/sync.tickets/1.md
    exists: false
  # file_exists sees only files the run creates, so look in the trace for a Bash command that names
  # the spec and deletes, moves or writes into it.
  - type: regex
    name: keeps-the-spec-as-it-was
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.md)(?=(?:[^"\\]|\\.)*?(?:(?:\b|(?<=\\n))(?:rm|unlink|mv|tee|truncate)\b|(?:\b|(?<=\\n))(?:sed|perl)\b(?:[^"\\]|\\.)*?\s-[a-zA-Z]*i\b|(?<![0-9&])>>?\s*(?:\\"|'')?(?:\$|(?:[^"\\\s]|\\.)*?sync\.md)))'
    match: not_contains
