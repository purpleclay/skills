schema_version: "1.0"
name: revised-breakdown
description: When the engineer rejects a breakdown and says what is wrong, /to-tickets proposes a new one that fixes it, and publishes that one once it is approved.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/sync.md

    I won't be around to answer, so here are my replies in advance. I reject the first breakdown you show me. If you ask what is wrong: `todo logout` must be a ticket of its own, with no other criteria. I approve the breakdown you show me after that.
  max_turns: 60
  allowed_tools: [Bash, Read, Write, Edit]
graders:
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-several-tickets
    path: .eval-bin/attempt-2
  - type: file_exists
    name: every-criterion-in-one-ticket
    path: .eval-bin/criteria-split
  # Written for an issue whose only criterion is the one for `todo logout`, as the rejection asks.
  - type: file_exists
    name: publishes-the-revised-breakdown
    path: .eval-bin/alone
  # file_exists sees only files the run creates, so the trace has to show Bash commands that name
  # the spec and its tickets directory and delete them.
  - type: regex
    name: deletes-the-spec
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.md)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:rm|unlink)\b)'
  - type: regex
    name: deletes-the-tickets
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.tickets(?!\.draft))(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))rm\b)'
