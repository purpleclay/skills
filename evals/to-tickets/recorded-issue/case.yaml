schema_version: "1.0"
name: recorded-issue
description: A spec saved with an issue URL in its front matter, as /refine once saved one, publishes as a new issue in the current repository, never edits the recorded issue, and never publishes the front matter.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/due-dates.md
  max_turns: 15
  allowed_tools: [Bash, Read]
graders:
  # The stand-in gh writes this only for a new issue in acme/todo with the spec's exact title and body.
  - type: file_exists
    name: publishes-a-new-issue
    path: .eval-bin/published
  - type: file_exists
    name: never-edits-an-issue
    path: .eval-bin/edited
    exists: false
  # The stand-in gh writes attempt-<n> for each publish, so a second one could replace the right issue with the wrong text.
  - type: file_exists
    name: publishes-once
    path: .eval-bin/attempt-2
    exists: false
