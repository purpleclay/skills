schema_version: "1.0"
name: publish-fails
description: When GitHub rejects the publish, /to-tickets tries once, reports the error and leaves the spec as it was.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/due-dates.md

    I won't be around to answer, so here is my reply in advance: I approve the tickets you show me.
  max_turns: 30
  allowed_tools: [Agent, Bash, Read]
graders:
  # The stand-in gh writes attempt-<n> for each publish, and fails every one.
  - type: file_exists
    name: tries-to-publish
    path: .eval-bin/attempt-1
  - type: file_exists
    name: does-not-retry
    path: .eval-bin/attempt-2
    exists: false
  # file_exists sees only files the run creates, so look in the trace for a Bash command that names
  # the spec and deletes, moves or writes into it: rm, unlink, mv, tee, truncate, sed or perl with -i,
  # or a redirect into the spec or a variable.
  - type: regex
    name: keeps-the-spec-as-it-was
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?due-dates\.md)(?=(?:[^"\\]|\\.)*?(?:(?:\b|(?<=\\n))(?:rm|unlink|mv|tee|truncate)\b|(?:\b|(?<=\\n))(?:sed|perl)\b(?:[^"\\]|\\.)*?\s-[a-zA-Z]*i\b|(?<![0-9&])>>?\s*(?:\\"|'')?(?:\$|(?:[^"\\\s]|\\.)*?due-dates\.md)))'
    match: not_contains
