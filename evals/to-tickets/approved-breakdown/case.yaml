schema_version: "1.0"
name: approved-breakdown
description: Once the engineer approves a breakdown, /to-tickets publishes every ticket in the spec's format, replacing the recorded issue with the first and creating the rest in its repository, sets their dependencies and deletes the spec and its tickets.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/sync.md

    I won't be around to answer, so here is my reply in advance: I approve the first breakdown you show me.
  max_turns: 60
  allowed_tools: [Bash, Read, Write, Edit]
graders:
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-several-tickets
    path: .eval-bin/attempt-2
  - type: file_exists
    name: first-ticket-replaces-the-recorded-issue
    path: .eval-bin/first-replaces
  - type: file_exists
    name: publishes-only-in-that-repository
    path: .eval-bin/wrong-repo
    exists: false
  # Written while the published issues hold the spec's criteria between them, each exactly once.
  - type: file_exists
    name: every-criterion-in-one-ticket
    path: .eval-bin/criteria-split
  # Written while each of the spec's open questions is in at least one published issue.
  - type: file_exists
    name: keeps-the-open-questions
    path: .eval-bin/questions-kept
  # The tickets are written to a draft directory and moved into place in one Bash command, so a
  # rerun never finds part of a breakdown.
  - type: regex
    name: saves-the-tickets-whole
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.tickets\.draft)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))mv\b)'
  - type: file_exists
    name: every-ticket-in-the-spec-format
    path: .eval-bin/misformatted
    exists: false
  - type: file_exists
    name: no-ticket-mentions-another
    path: .eval-bin/mentions-another
    exists: false
  - type: file_exists
    name: sets-dependencies
    path: .eval-bin/edges
  # Written for a dependency on an issue that was not published before the one it blocks.
  - type: file_exists
    name: blockers-come-first
    path: .eval-bin/bad-order
    exists: false
  # file_exists sees only files the run creates, so the trace has to show Bash commands that name
  # the spec and its tickets directory and delete them.
  - type: regex
    name: deletes-the-spec
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.md)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:rm|unlink)\b)'
  - type: regex
    name: deletes-the-tickets
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.tickets(?!\.draft))(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))rm\b)'
