schema_version: "1.0"
name: nothing-saved
description: With no path and no saved spec, /to-tickets says there is nothing to publish and never runs gh.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets
  max_turns: 15
  allowed_tools: [Bash, Read]
graders:
  # The stand-in gh logs every call to this file, gh auth status included.
  - type: file_exists
    name: never-runs-gh
    path: .eval-bin/calls
    exists: false
  - type: regex
    name: says-there-is-nothing-to-publish
    pattern: '(?:nothing to publish|no (?:saved )?specs?\b|(?:couldn.t|could not|didn.t|did not) find (?:a|any) (?:saved )?spec)'
    flags: i
