schema_version: "1.0"
name: rerun
description: With a saved breakdown whose first ticket is published, /to-tickets publishes only the other two without asking, makes them depend on the tickets that block them, then deletes the spec and its tickets.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/sync.md
  max_turns: 40
  allowed_tools: [Bash, Read, Write, Edit]
graders:
  # Written while the new issues are exactly the unpublished tickets.
  - type: file_exists
    name: publishes-the-remaining-tickets
    path: .eval-bin/titles-match
  - type: file_exists
    name: publishes-nothing-else
    path: .eval-bin/attempt-3
    exists: false
  # Written while the dependencies are exactly the ones the saved tickets record.
  - type: file_exists
    name: sets-the-approved-dependencies
    path: .eval-bin/linked
  - type: regex
    name: shows-no-breakdown
    target: trace
    pattern: '^\{"type":"assistant".*\|\s*Blocks\s*\|'
    flags: m
    match: not_contains
  # file_exists sees only files the run creates, so the trace has to show Bash commands that name
  # the spec and its tickets directory and delete them.
  - type: regex
    name: deletes-the-spec
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.md)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:rm|unlink)\b)'
  - type: regex
    name: deletes-the-tickets
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.tickets(?!\.draft))(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))rm\b)'
