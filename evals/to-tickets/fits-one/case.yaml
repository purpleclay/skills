schema_version: "1.0"
name: fits-one
description: A spec with ten acceptance criteria that one agent can deliver in one context publishes as exactly one issue holding every criterion.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/tidy.md

    I won't be around to answer, so here is my reply in advance: I approve the tickets you show me.
  max_turns: 30
  allowed_tools: [Agent, Bash, Read, Write, Edit]
graders:
  # The stand-in gh writes this only for a new issue in acme/todo with the spec's exact title and body.
  - type: file_exists
    name: publishes-the-spec-as-one-issue
    path: .eval-bin/published
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-once
    path: .eval-bin/attempt-2
    exists: false
