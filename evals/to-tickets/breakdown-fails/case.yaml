schema_version: "1.0"
name: breakdown-fails
description: When GitHub rejects the second ticket of an approved breakdown, /to-tickets stops without retrying, and keeps the spec and the tickets, with the first recorded as published.
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/sync.md

    I won't be around to answer, so here is my reply in advance: I approve the first breakdown you show me.
  max_turns: 60
  allowed_tools: [Agent, Bash, Read, Write, Edit]
graders:
  # The stand-in gh writes attempt-<n> for each publish, and fails every one from the second.
  - type: file_exists
    name: tries-the-second-ticket
    path: .eval-bin/attempt-2
  - type: file_exists
    name: does-not-retry
    path: .eval-bin/attempt-3
    exists: false
  # The second ticket is marked as publishing before its issue is created, so a rerun knows to ask
  # whether GitHub made it. The mark and the ticket's name sit in the same tool call.
  - type: regex
    name: marks-the-second-as-publishing
    target: trace
    pattern: '"type":"tool_use"[^\n]*?(?:2\.md[^\n]*?publishing: yes|publishing: yes[^\n]*?2\.md)'
  - type: file_exists
    name: keeps-the-tickets
    path: specs/sync.tickets/1.md
  # The first ticket is published as acme/todo#12, and only its file can say so.
  - type: regex
    name: records-the-first-as-published
    target: trace
    pattern: 'published: https://github\.com/acme/todo/issues/12'
  # file_exists sees only files the run creates, so look in the trace for a Bash command that names
  # the spec and deletes, moves or writes into it.
  - type: regex
    name: keeps-the-spec-as-it-was
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?sync\.md)(?=(?:[^"\\]|\\.)*?(?:(?:\b|(?<=\\n))(?:rm|unlink|mv|tee|truncate)\b|(?:\b|(?<=\\n))(?:sed|perl)\b(?:[^"\\]|\\.)*?\s-[a-zA-Z]*i\b|(?<![0-9&])>>?\s*(?:\\"|'')?(?:\$|(?:[^"\\\s]|\\.)*?sync\.md)))'
    match: not_contains
