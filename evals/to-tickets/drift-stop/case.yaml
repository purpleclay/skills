schema_version: "1.0"
name: drift-stop
description: When the code already does what the spec asks and the engineer judges the spec no longer valid, /to-tickets lists the mismatch, creates no tickets, leaves the spec as it was and says to refine it in a separate session.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/due-dates.md

    I won't be around to answer, so here is my reply in advance: if you tell me the code no longer matches the spec, the spec is no longer valid.
  max_turns: 30
  allowed_tools: [Agent, Bash, Read, Write, Edit]
graders:
  # The main conversation says that the code already has due dates.
  - type: regex
    name: lists-the-mismatch
    target: trace
    pattern: '^\{"type":"assistant"[^\n]*(?:already|now (?:accepts|supports|has|takes|shows|saves|stores|prints))[^\n]*"parent_tool_use_id":null'
    flags: m
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-nothing
    path: .eval-bin/attempt-1
    exists: false
  - type: file_exists
    name: saves-no-tickets
    path: specs/due-dates.tickets/1.md
    exists: false
  - type: regex
    name: says-to-refine-in-a-separate-session
    pattern: '/refine[\s\S]*\b(?:new|separate|fresh|another|different)\b[^.\n]{0,20}\b(?:session|conversation|chat)\b|\b(?:new|separate|fresh|another|different)\b[^.\n]{0,20}\b(?:session|conversation|chat)\b[\s\S]*/refine'
    flags: i
  # file_exists sees only files the run creates, so look in the trace for a Bash command that names
  # the spec and deletes, moves or writes into it.
  - type: regex
    name: keeps-the-spec-as-it-was
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?due-dates\.md)(?=(?:[^"\\]|\\.)*?(?:(?:\b|(?<=\\n))(?:rm|unlink|mv|tee|truncate)\b|(?:\b|(?<=\\n))(?:sed|perl)\b(?:[^"\\]|\\.)*?\s-[a-zA-Z]*i\b|(?<![0-9&])>>?\s*(?:\\"|'')?(?:\$|(?:[^"\\\s]|\\.)*?due-dates\.md)))'
    match: not_contains
