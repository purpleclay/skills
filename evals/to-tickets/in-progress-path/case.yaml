schema_version: "1.0"
name: in-progress-path
description: Given the path of a spec /refine is still refining, /to-tickets says it is still being refined and never runs gh.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets .git/refine/sync-todos-between-devices.md
  max_turns: 15
  allowed_tools: [Bash, Read]
graders:
  # The stand-in gh logs every call to this file, gh auth status included.
  - type: file_exists
    name: never-runs-gh
    path: .eval-bin/calls
    exists: false
  - type: regex
    name: says-it-is-still-being-refined
    pattern: '(?:in progress|still being refined|still refining|not (?:yet )?ready)'
    flags: i
