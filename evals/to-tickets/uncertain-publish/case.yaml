schema_version: "1.0"
name: uncertain-publish
description: When a saved ticket was being published as a new issue when an earlier run stopped, /to-tickets asks whether GitHub made that issue and publishes nothing until the engineer answers.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/sync.md
  max_turns: 30
  allowed_tools: [Bash, Read, Write, Edit]
graders:
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-nothing
    path: .eval-bin/attempt-1
    exists: false
  # The stand-in gh writes edges for each dependency it sets.
  - type: file_exists
    name: sets-no-dependencies
    path: .eval-bin/edges
    exists: false
  - type: regex
    name: asks-about-the-issue
    pattern: '(?:\?|\b(?:tell me|let me know|reply|send me|confirm)\b)'
    flags: i
