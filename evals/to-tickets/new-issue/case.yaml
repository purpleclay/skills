schema_version: "1.0"
name: new-issue
description: Given only a spec that fits in one ticket, /to-tickets shows no breakdown, asks nothing, creates a new issue with the spec's title and body unchanged, then deletes the spec.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/due-dates.md
  max_turns: 15
  allowed_tools: [Bash, Read]
graders:
  # The stand-in gh writes this only for a new issue in acme/todo with the spec's exact title and body.
  - type: file_exists
    name: publishes-the-spec-as-a-new-issue
    path: .eval-bin/published
  # The stand-in gh writes attempt-<n> for each publish, so a second one could replace the right issue with the wrong text.
  - type: file_exists
    name: publishes-once
    path: .eval-bin/attempt-2
    exists: false
  # file_exists sees only files the run creates, so the trace has to show a Bash command that
  # names the spec and runs rm or unlink, in any order.
  - type: regex
    name: deletes-the-spec
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?due-dates\.md)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:rm|unlink)\b)'
  # A breakdown is a table with a Blocks column, in the conversation's own text.
  - type: regex
    name: shows-no-breakdown
    target: trace
    pattern: '^\{"type":"assistant".*\|\s*Blocks\s*\|'
    flags: m
    match: not_contains
  - type: regex
    name: asks-nothing
    pattern: '\?'
    match: not_contains
