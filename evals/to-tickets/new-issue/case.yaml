schema_version: "1.0"
name: new-issue
description: Given a spec that fits in one ticket, /to-tickets surveys the code and, once the engineer approves the ticket, creates one new issue labelled enhancement with the spec's title and body unchanged, then deletes the spec.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-tickets specs/due-dates.md

    I won't be around to answer, so here is my reply in advance: I approve the tickets you show me.
  max_turns: 30
  allowed_tools: [Agent, Bash, Read]
graders:
  # The stand-in gh writes this only for a new issue in acme/todo with the spec's exact title and body.
  - type: file_exists
    name: publishes-the-spec-as-a-new-issue
    path: .eval-bin/published
  # The stand-in gh writes attempt-<n> for each publish, so a second one could replace the right issue with the wrong text.
  - type: file_exists
    name: publishes-once
    path: .eval-bin/attempt-2
    exists: false
  # file_exists sees only files the run creates, so the trace has to show a Bash command that
  # names the spec and runs rm or unlink, in any order.
  - type: regex
    name: deletes-the-spec
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?due-dates\.md)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:rm|unlink)\b)'
  - type: tool_used
    name: surveys-the-code
    tool: Agent
    input_match: "purpleclay-skills:surveyor"
  # The due-date spec adds behaviour, so its ticket is an enhancement.
  - type: file_exists
    name: labels-it-an-enhancement
    path: .eval-bin/labelled-enhancement
  - type: file_exists
    name: gives-no-other-label
    path: .eval-bin/labelled-bug
    exists: false
