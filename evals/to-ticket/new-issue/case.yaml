schema_version: "1.0"
name: new-issue
description: Given a spec that adds behaviour, /to-ticket publishes it without asking as one new issue labelled enhancement, with the spec's title and body unchanged, then deletes the spec.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-ticket specs/due-dates.md
  max_turns: 15
  allowed_tools: [Bash, Read]
graders:
  # The stand-in gh writes this only for a new issue in acme/todo with the spec's exact title and body.
  - type: file_exists
    name: publishes-the-spec-as-a-new-issue
    path: .eval-bin/published
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-once
    path: .eval-bin/attempt-2
    exists: false
  # The stand-in gh names this after every label given, so it only exists for enhancement alone.
  - type: file_exists
    name: labels-it-enhancement-alone
    path: .eval-bin/labelled-enhancement
  # file_exists sees only files the run creates, so the trace has to show a Bash command that
  # names the spec and runs rm or unlink, in any order.
  - type: regex
    name: deletes-the-spec
    target: trace
    pattern: '"name":"Bash","input":\{(?:"[^"]*":"(?:[^"\\]|\\.)*",)*"command":"(?=(?:[^"\\]|\\.)*?due-dates\.md)(?=(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:rm|unlink)\b)'
  - type: regex
    name: asks-nothing
    pattern: '\?'
    match: not_contains
