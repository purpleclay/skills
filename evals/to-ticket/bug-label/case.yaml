schema_version: "1.0"
name: bug-label
description: Given a spec that fixes behaviour that is wrong today, /to-ticket publishes it as one new issue labelled bug, and no other label.
tags: [smoke]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /to-ticket specs/empty-file.md
  max_turns: 15
  allowed_tools: [Bash, Read]
graders:
  # The stand-in gh writes this only for a new issue in acme/todo with the spec's exact title and body.
  - type: file_exists
    name: publishes-the-spec-as-a-new-issue
    path: .eval-bin/published
  # The stand-in gh writes attempt-<n> for each publish.
  - type: file_exists
    name: publishes-once
    path: .eval-bin/attempt-2
    exists: false
  # The stand-in gh names this after every label given, so it only exists for bug alone.
  - type: file_exists
    name: labels-it-bug-alone
    path: .eval-bin/labelled-bug
